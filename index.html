<!-- Tema guardado antes de pintar (evita el destello claro/oscuro) -->
<script>
  try { var t = localStorage.getItem('misionAdmision.tema'); if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.theme = t === 'claro' ? 'light' : 'dark'; } catch (e) {}
</script>

<body>
<a class="saltar" href="#contenido">Saltar al contenido</a>

<header class="cabecera">
  <button class="btn-icono solo-movil" type="button" id="btn-menu" aria-label="Abrir el menú de módulos" aria-controls="lateral" aria-expanded="false"></button>
  <a class="marca" href="#inicio" aria-label="Misión admisión, ir al panel general">
    <span class="marca-logo" aria-hidden="true"></span>
    <span class="marca-texto">
      <b>Misión admisión</b>
      <small>Ingeniería Aeronáutica · preparación</small>
    </span>
  </a>
  <div class="cabecera-acciones">
    <button class="btn-icono" type="button" id="btn-pizarra" aria-label="Abrir el pizarrón" title="Pizarrón"></button>
    <button class="btn-icono" type="button" id="btn-tema" aria-label="Cambiar tema"></button>
    <button class="btn btn-secundario btn-asistente" type="button" id="btn-asistente" aria-controls="asistente" aria-expanded="false">
      <span class="ico" aria-hidden="true"></span><span class="txt">Centro de comando IA</span>
    </button>
  </div>
</header>

<div class="marco">
  <nav class="lateral" id="lateral" aria-label="Módulos del curso"></nav>
  <main class="contenido" id="contenido" tabindex="-1"></main>
  <aside class="asistente" id="asistente" aria-label="Centro de comando IA"></aside>
</div>
<div class="velo" id="velo" hidden></div>
<div class="aviso-flotante" id="aviso" role="status" aria-live="polite"></div>

<noscript><p class="sin-js">Esta plataforma necesita JavaScript activado.</p></noscript>
